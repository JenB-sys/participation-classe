<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participation en classe</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:    #0f0c29;
      --bg-mid:     #302b63;
      --bg-card:    #1e1b4b;
      --accent-gold:#FFD700;
      --accent-pink:#FF6B9D;
      --accent-teal:#00F5D4;
      --text-main:  #f0eeff;
      --text-muted: #9d9bbf;
      --radius:     14px;
      --serif: 'Libre Baskerville', 'Baskerville', Georgia, serif;
      --sans: system-ui, -apple-system, sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: var(--sans);
      background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 60%, #24243e 100%);
      min-height: 100vh;
      color: var(--text-main);
    }

    /* ── SETUP ─────────────────────────────────────────── */
    #setup-phase {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
    }

    .setup-box {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    .setup-box h1 {
      font-family: var(--serif);
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .setup-box p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .hint {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    textarea {
      flex: 1;
      padding: 14px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 15px;
      font-family: var(--sans);
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
      min-height: 80px;
    }
    textarea::placeholder { color: var(--text-muted); }
    textarea:focus { border-color: var(--accent-teal); }

    .btn {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--sans);
    }
    .btn-add {
      background: var(--accent-teal);
      color: #0f0c29;
    }
    .btn-add:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-start {
      width: 100%;
      margin-top: 24px;
      padding: 18px;
      font-family: var(--serif);
      font-size: 1.1rem;
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-pink));
      color: #0f0c29;
      border-radius: 12px;
      letter-spacing: 0.02em;
    }
    .btn-start:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(255,107,157,0.4); }
    .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #student-list-setup {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }
    #student-list-setup::-webkit-scrollbar { width: 4px; }
    #student-list-setup::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .setup-student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
    }
    .setup-student-item span { font-size: 15px; }
    .btn-remove {
      background: transparent;
      border: 1px solid rgba(255,107,157,0.4);
      color: var(--accent-pink);
      padding: 5px 12px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-remove:hover { background: rgba(255,107,157,0.15); }

    .count-badge {
      display: inline-block;
      background: rgba(255,213,0,0.15);
      color: var(--accent-gold);
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    /* ── CLASS PHASE ────────────────────────────────────── */
    #class-phase {
      display: none;
      height: 100vh;
      overflow: hidden;
    }

    .class-layout {
      display: flex;
      height: 100vh;
    }

    /* Colonne gauche : liste élèves */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: rgba(0,0,0,0.35);
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      overflow-y: auto;
      gap: 8px;
    }

    .sidebar-title {
      font-family: var(--serif);
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 4px;
      letter-spacing: 0.03em;
    }

    .student-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.18s;
      color: var(--text-main);
      font-size: 14px;
      font-family: var(--sans);
      position: relative;
      overflow: hidden;
      text-align: left;
    }
    .student-btn:hover {
      background: rgba(0,245,212,0.1);
      border-color: var(--accent-teal);
      transform: translateX(3px);
    }
    .student-btn.bump {
      animation: bump 0.4s cubic-bezier(0.36,0.07,0.19,0.97);
    }
    @keyframes bump {
      0%,100% { transform: scale(1) translateX(0); }
      30%      { transform: scale(1.06) translateX(2px); }
    }

    .student-name { font-weight: 500; }
    .student-score {
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 1.1rem;
      min-width: 28px;
      text-align: right;
    }

    /* Ripple sur le bouton */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(0,245,212,0.35);
      transform: scale(0);
      animation: ripple-anim 0.55s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }

    /* Zone principale droite */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .class-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .class-header h1 {
      font-family: var(--serif);
      font-size: 1.4rem;
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions { display: flex; gap: 10px; }

    .btn-export {
      padding: 10px 20px;
      background: rgba(0,245,212,0.1);
      border: 1px solid var(--accent-teal);
      color: var(--accent-teal);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-export:hover { background: rgba(0,245,212,0.2); }

    .btn-end {
      padding: 10px 20px;
      background: rgba(255,107,157,0.1);
      border: 1px solid var(--accent-pink);
      color: var(--accent-pink);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-end:hover { background: rgba(255,107,157,0.2); }

    /* Podium */
    .podium-area {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .podium-label {
      font-family: var(--serif);
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Top 3 podium visuel */
    .podium-visual {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      height: 180px;
      flex-shrink: 0;
    }

    .podium-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .podium-avatar {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .podium-pname {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      max-width: 80px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 6px;
    }

    .podium-pts {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .podium-column {
      border-radius: 8px 8px 0 0;
      width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f0c29;
    }

    .podium-1 .podium-column {
      height: 130px;
      background: linear-gradient(160deg, var(--accent-gold), #f59e0b);
      box-shadow: 0 0 40px rgba(255,213,0,0.4);
    }
    .podium-2 .podium-column {
      height: 95px;
      background: linear-gradient(160deg, #d1d5db, #9ca3af);
      box-shadow: 0 0 20px rgba(209,213,219,0.2);
    }
    .podium-3 .podium-column {
      height: 70px;
      background: linear-gradient(160deg, #cd7f32, #a0522d);
      box-shadow: 0 0 20px rgba(205,127,50,0.2);
    }

    /* Classement liste */
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ranking-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      transition: background 0.2s;
    }
    .ranking-row:hover { background: rgba(255,255,255,0.07); }

    .rank-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 24px;
      text-align: center;
    }
    .rank-name {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
    }
    .rank-pts {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .rank-bar-wrap {
      width: 80px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .rank-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-pink));
      transition: width 0.4s ease;
    }

    /* ── CONFETTIS ──────────────────────────────────────── */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* ── FLASH MESSAGE ──────────────────────────────────── */
    #flash {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-pink));
      color: #0f0c29;
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 40px;
      box-shadow: 0 8px 30px rgba(255,107,157,0.4);
      z-index: 10000;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }
    #flash.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- ════════ SETUP ════════ -->
<div id="setup-phase">
  <div class="setup-box">
    <h1>Participation en classe</h1>
    <p class="subtitle">Ajoutez vos élèves, puis commencez le cours.</p>

    <p class="hint">Tapez plusieurs noms séparés par des virgules,<br>ou un nom par ligne.</p>
    <div class="input-row">
      <textarea id="name-input" placeholder="Ex : Alice, Bob, Clara&#10;ou un nom par ligne" rows="3" autocomplete="off"></textarea>
      <button class="btn btn-add" onclick="addStudents()">Ajouter</button>
    </div>

    <div id="count-badge" class="count-badge" style="display:none"></div>
    <div id="student-list-setup"></div>

    <button class="btn btn-start" id="start-btn" onclick="startClass()" disabled>
      Commencer le cours →
    </button>
  </div>
</div>

<!-- ════════ CLASS PHASE ════════ -->
<div id="class-phase">
  <canvas id="confetti-canvas"></canvas>
  <div id="flash">Bravo !</div>

  <div class="class-layout">

    <!-- Colonne élèves -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-title">Élèves — cliquer pour un +</div>
      <!-- injecté par JS -->
    </div>

    <!-- Zone principale -->
    <div class="main-area">
      <div class="class-header">
        <h1>✨ Participation en classe</h1>
        <div class="header-actions">
          <button class="btn-export" onclick="exportExcel()">⬇ Exporter Excel</button>
          <button class="btn-end" onclick="endClass()">Terminer le cours</button>
        </div>
      </div>

      <div class="podium-area">
        <div class="podium-label">🏆 Classement en direct</div>

        <!-- Podium visuel top 3 -->
        <div class="podium-visual" id="podium-visual"></div>

        <!-- Liste classement -->
        <div class="ranking-list" id="ranking-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ════ DONNÉES ════ */
let students = [];

/* ════ SETUP ════ */
function addStudents() {
  const input = document.getElementById('name-input');
  const raw = input.value;
  if (!raw.trim()) return;

  // Séparer par virgule OU par retour à la ligne
  const names = raw
    .split(/[,\n]/)
    .map(n => n.trim())
    .filter(n => n.length > 0);

  names.forEach(name => {
    // Éviter les doublons
    if (!students.find(s => s.name.toLowerCase() === name.toLowerCase())) {
      students.push({ id: Date.now() + Math.random(), name, points: 0 });
    }
  });

  input.value = '';
  input.focus();
  renderSetupList();
}

function removeStudent(id) {
  students = students.filter(s => s.id !== id);
  renderSetupList();
}

function renderSetupList() {
  const list = document.getElementById('student-list-setup');
  const badge = document.getElementById('count-badge');
  const btn = document.getElementById('start-btn');

  if (students.length === 0) {
    list.innerHTML = '';
    badge.style.display = 'none';
    btn.disabled = true;
    return;
  }
  badge.style.display = 'inline-block';
  badge.textContent = `${students.length} élève${students.length > 1 ? 's' : ''}`;
  btn.disabled = false;

  list.innerHTML = students.map(s => `
    <div class="setup-student-item">
      <span>${s.name}</span>
      <button class="btn-remove" onclick="removeStudent(${s.id})">Retirer</button>
    </div>
  `).join('');
}

function startClass() {
  document.getElementById('setup-phase').style.display = 'none';
  document.getElementById('class-phase').style.display = 'block';
  renderSidebar();
  renderRanking();
}

function endClass() {
  students.forEach(s => s.points = 0);
  document.getElementById('setup-phase').style.display = 'flex';
  document.getElementById('class-phase').style.display = 'none';
  renderSetupList();
}

/* ════ SIDEBAR ════ */
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const items = sidebar.querySelectorAll('.student-btn');
  if (items.length === students.length) {
    // mise à jour des scores seulement
    students.forEach(s => {
      const el = document.getElementById(`score-${s.id}`);
      if (el) el.textContent = s.points;
    });
    return;
  }
  // premier rendu
  const title = sidebar.querySelector('.sidebar-title');
  sidebar.innerHTML = '';
  sidebar.appendChild(title);
  students.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'student-btn';
    btn.id = `btn-${s.id}`;
    btn.innerHTML = `<span class="student-name">${s.name}</span><span class="student-score" id="score-${s.id}">0</span>`;
    btn.addEventListener('click', (e) => {
      addPoint(s.id);
      createRipple(btn, e);
    });
    sidebar.appendChild(btn);
  });
}

function createRipple(btn, e) {
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(btn.clientWidth, btn.clientHeight);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

/* ════ POINTS ════ */
function addPoint(id) {
  const student = students.find(s => s.id === id);
  if (!student) return;
  student.points++;

  // score sidebar
  const scoreEl = document.getElementById(`score-${id}`);
  if (scoreEl) scoreEl.textContent = student.points;

  // animation bouton
  const btn = document.getElementById(`btn-${id}`);
  if (btn) {
    btn.classList.remove('bump');
    void btn.offsetWidth;
    btn.classList.add('bump');
  }

  // flash
  showFlash(student.name);

  // confettis
  launchConfetti();

  // classement
  renderRanking();
}

/* ════ FLASH ════ */
const flashEl = document.getElementById('flash');
const messages = ['Bravo !', 'Super !', 'Excellent !', 'Bien joué !', 'Parfait !', 'Génial !'];
let flashTimer = null;

function showFlash(name) {
  const msg = messages[Math.floor(Math.random() * messages.length)];
  flashEl.textContent = `${msg} ${name}`;
  flashEl.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => flashEl.classList.remove('show'), 1600);
}

/* ════ CLASSEMENT ════ */
function renderRanking() {
  const sorted = [...students].sort((a, b) => b.points - a.points);
  const max = sorted[0]?.points || 1;

  // Podium visuel top 3
  const podiumEl = document.getElementById('podium-visual');
  const top3 = [sorted[1], sorted[0], sorted[2]]; // ordre visuel: 2e, 1er, 3e
  const classes = ['podium-2', 'podium-1', 'podium-3'];
  const medals = ['🥈', '🥇', '🥉'];
  const labels = ['2', '1', '3'];

  podiumEl.innerHTML = top3.map((s, i) => {
    if (!s) return `<div class="podium-block ${classes[i]}">
      <div class="podium-column">${labels[i]}</div>
    </div>`;
    return `<div class="podium-block ${classes[i]}">
      <div class="podium-avatar">${medals[i]}</div>
      <div class="podium-pname">${s.name}</div>
      <div class="podium-pts">${s.points} pt${s.points > 1 ? 's' : ''}</div>
      <div class="podium-column">${labels[i]}</div>
    </div>`;
  }).join('');

  // Liste complète
  const listEl = document.getElementById('ranking-list');
  listEl.innerHTML = sorted.map((s, i) => {
    const pct = max > 0 ? Math.round((s.points / max) * 100) : 0;
    return `<div class="ranking-row">
      <div class="rank-num">${i + 1}</div>
      <div class="rank-name">${s.name}</div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
      <div class="rank-pts">${s.points}</div>
    </div>`;
  }).join('');
}

/* ════ CONFETTIS ════ */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId = null;

const COLORS = ['#FFD700','#FF6B9D','#00F5D4','#a78bfa','#fb923c','#34d399'];

function launchConfetti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -10,
      r: Math.random() * 7 + 4,
      d: Math.random() * 2 + 1,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      tilt: Math.random() * 10 - 10,
      tiltSpeed: Math.random() * 0.1 + 0.05,
      rotation: 0,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
      opacity: 1,
    });
  }
  if (!animId) animLoop();
}

function animLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
    }
    ctx.restore();
    p.y += p.d * 4;
    p.rotation += p.tiltSpeed;
    p.tilt += p.tiltSpeed;
    p.opacity -= 0.012;
  });
  particles = particles.filter(p => p.opacity > 0);
  if (particles.length > 0) {
    animId = requestAnimationFrame(animLoop);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

/* ════ EXPORT EXCEL ════ */
function exportExcel() {
  const sorted = [...students].sort((a, b) => b.points - a.points);
  const date = new Date().toLocaleDateString('fr-CH');

  // CSV avec BOM pour Excel (UTF-8)
  const BOM = '\uFEFF';
  const header = 'Rang;Élève;Points\n';
  const rows = sorted.map((s, i) => `${i + 1};${s.name};${s.points}`).join('\n');
  const footer = `\n\nDate;${date}\nTotal élèves;${students.length}`;
  const csv = BOM + header + rows + footer;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `participation_${date.replace(/\//g, '-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
